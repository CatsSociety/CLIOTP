[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cliotp"
version = "0.1.0"
description = "Gestor de códigos TOTP en terminal con bóveda cifrada"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
cliotp = "cliotp.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
